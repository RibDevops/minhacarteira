{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-wallet2 brand-accent" style="font-size: 2.5rem;"></i>
                    <h2 class="fw-bold mt-2 mb-0">Minha Carteira</h2>
                    <p class="text-muted">Acesse sua conta para continuar</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'login' %}" class="d-flex flex-column gap-3">
                    {% csrf_token %}

                    <div class="form-floating">
                        <input type="text" name="username" id="username" class="form-control" placeholder="Usuário" autofocus>
                        <label for="username">Usuário</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Senha">
                        <label for="password">Senha</label>
                    </div>

                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 py-3 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'cal:password_reset' %}" class="text-muted small text-decoration-none">Esqueci minha senha</a>
                </div>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted">Não tem uma conta?</span>
                    <a href="{% url 'cal:register' %}" class="fw-bold text-decoration-none ms-1" style="color: var(--brand-primary);">Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-floating > input.form-control {
        height: calc(3.5rem + 2px);
        line-height: 1.25;
    }
    .form-floating > label {
        padding: 1rem 0.75rem;
    }
    .form-floating input:focus {
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 0.25rem rgba(var(--brand-primary-rgb), 0.25);
    }
</style>
{% endblock %}
